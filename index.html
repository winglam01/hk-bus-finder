<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Route finder and live departure boards for KMB, Citybus and Lantau Bus in Hong Kong." />

    <!-- Standalone web app: lets iPhone add this to the Home Screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HK Bus" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <title>HK Bus Finder</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <div class="layout">
      <aside class="sidebar" aria-label="Primary">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="13" rx="3" />
              <path d="M3 10h18" />
              <path d="M7 19v2M17 19v2" />
              <path d="M7.5 13.5h.01M16.5 13.5h.01" />
            </svg>
          </span>
          <span class="brand__text">
            <strong>HK Bus Finder</strong>
            <span>KMB &middot; Citybus &middot; Lantau</span>
          </span>
        </div>

        <nav class="nav" aria-label="Sections">
          <p class="nav__label">Find</p>
          <a class="nav__item" href="#/finder" data-nav="finder">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
            <span>Route finder</span>
          </a>
          <a class="nav__item" href="#/board" data-nav="board">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10" /></svg>
            <span>Departure board</span>
          </a>

          <p class="nav__label">Library</p>
          <a class="nav__item" href="#/saved" data-nav="saved">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v16l-6-4-6 4z" /></svg>
            <span>Saved</span>
          </a>
        </nav>

        <div class="sidebar__foot">
          <button class="ghost-btn" type="button" data-action="toggle-theme">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
            <span data-theme-label>Auto theme</span>
          </button>
          <p class="sidebar__note" data-sources>Live open data from the Transport Department, Citybus and New Lantao Bus.</p>
        </div>
      </aside>

      <div class="content">
        <main id="main" class="main" tabindex="-1"></main>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="./app.js" type="module"></script>
  </body>
</html>
